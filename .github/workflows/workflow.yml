on:
  workflow_call:
    inputs:
      visibility:
        description: |
          `public`, `unlisted`, or `private` ([private flakes](https://docs.determinate.systems/flakehub/private-flakes) are available only on a [FlakeHub paid plan](https://flakehub.com/signup)).
        required: false
        type: string
      default-branch:
        description: |
          The [default Git branch](https://docs.github.com/repositories/configuring-branches-and-merges-in-your-repository/managing-branches-in-your-repository/changing-the-default-branch) for the repository.
        required: false
        default: ${{ github.event.repository.default_branch }}
        type: string
      enable-ssh-agent:
        description: |
          Whether to enable [`webfactory/ssh-agent`](https://github.com/webfactory/ssh-agent) in the workflow. If you set this to `true` you need to supply a secret named `ssh-private-key`.
        required: false
        default: false
        type: boolean
      directory:
        description: |
          The root directory of your flake.
        required: false
        default: "."
        type: string
      fail-fast:
        description: |
          Whether to cancel all in-progress jobs if any matrix job fails
        required: false
        default: true
        type: boolean
      flake-iter-flakeref:
        description: |
          Deprecated and ignored. The flake inventory now comes from Determinate Nix's built-in flake schema support instead of flake-iter.
        type: string
        required: false
        default: https://flakehub.com/f/DeterminateSystems/flake-iter/*
      runner-map:
        description: |
          A custom mapping of [Nix system types](https://zero-to-nix.com/concepts/system-specificity) to desired Actions runners
        required: false
        type: string
        default: |
          {
            "aarch64-darwin": "macos-latest",
            "x86_64-linux": "ubuntu-latest",
            "aarch64-linux": "ubuntu-24.04-arm"
          }
      extra-nix-conf:
        description: |
          Extra Nix configuration passed to Determinate Nix
        required: false
        type: string
        default: ""
      allow-fork:
        description: |
          The `owner/repo` name of a fork that is allowed to publish to FlakeHub.
          Publishing from a fork is skipped unless `github.repository` matches this value exactly.
          Forks of the named repository still skip publishing.

          Example: `DeterminateSystems/nix-eval-jobs`
        required: false
        type: string
        default: ""
    outputs:
      flake_name:
        value: ${{ jobs.success.outputs.flake_name }}
        description: |
          The name of the flake.

          Example: `DeterminateSystems/flakehub-push`
      flake_version:
        value: ${{ jobs.success.outputs.flake_version }}
        description: |
          Version of the published flake.

          Example: `0.1.99+rev-2075013a3f3544d45a96f4b35df4ed03cd53779c`
      flakeref_exact:
        value: ${{ jobs.success.outputs.flakeref_exact }}
        description: |
          A precise reference that always resolves to this to this exact release.

          Example: `DeterminateSystems/flakehub-push/=0.1.99+rev-2075013a3f3544d45a96f4b35df4ed03cd53779c`
      flakeref_at_least:
        value: ${{ jobs.success.outputs.flakeref_at_least }}
        description: |
          A loose reference to this release.
          Depending on this reference will require at least this version, and will also resolve to newer releases.
          This output is not sufficient for deployment pipelines, use flake_exact instead.

          Example: `DeterminateSystems/flakehub-push/0.1.99+rev-2075013a3f3544d45a96f4b35df4ed03cd53779c`

    secrets:
      ssh-private-key:
        required: false

jobs:
  inventory:
    runs-on: ubuntu-latest

    outputs:
      systems: ${{ steps.inventory.outputs.systems }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # disabled pending strategy discussion on exposing tunables
      # - uses: Determinatesystems/flake-checker-action@main
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: ${{ inputs.enable-ssh-agent }}
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}
      - name: Inventory the flake for targeted systems
        id: inventory
        env:
          RUNNER_MAP: ${{ toJson(fromJson(inputs.runner-map)) }}
        working-directory: ${{ inputs.directory }}
        run: |
          set -euo pipefail

          inventory="$RUNNER_TEMP/inventory.json"
          nix flake show --json --all-systems --no-write-lock-file . > "$inventory"

          all_systems=$(jq -c '[.. | objects | select(has("forSystems")) | .forSystems[]] | unique' "$inventory")

          jq -r --argjson map "$RUNNER_MAP" '.[] | select($map[.] == null)' <<< "$all_systems" \
            | while IFS= read -r system; do
                echo "::warning::Flake contains derivation outputs for Nix system \`$system\` but no runner is specified for that system"
              done

          systems=$(jq -c --argjson map "$RUNNER_MAP" \
            'map(select($map[.] != null) | {"nix-system": ., runner: $map[.]})' <<< "$all_systems")

          if [ "$systems" = "[]" ]; then
            echo "::warning::Flake does not include a Nix system."
          fi

          echo "systems=$systems" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ${{ matrix.systems.runner }}
    needs: inventory
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        systems: ${{ fromJSON(needs.inventory.outputs.systems) }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            extra-experimental-features = provenance
            ${{ inputs.extra-nix-conf }}
      - uses: DeterminateSystems/flakehub-cache-action@main
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: ${{ inputs.enable-ssh-agent }}
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}
      - name: Build for ${{ matrix.systems.nix-system }}
        env:
          NIX_SYSTEM: ${{ matrix.systems.nix-system }}
        working-directory: ${{ inputs.directory }}
        run: |
          set -euo pipefail

          inventory="$RUNNER_TEMP/inventory.json"
          nix flake show --json --all-systems --drv-paths --output-paths --no-write-lock-file . > "$inventory"

          # One line per unique derivation: `<drv>^<outputs>` followed by its output paths.
          derivations=$(jq -r --arg sys "$NIX_SYSTEM" '
            [.. | objects
             | select(has("forSystems") and (.forSystems | index($sys)) and .derivation.path != null)
             | .derivation]
            | unique_by(.path)[]
            | "\(.path)^\(.outputs | keys | join(",")) \(.outputs | [.[]] | join(" "))"' "$inventory")

          if [ -z "$derivations" ]; then
            echo "No derivations to build for $NIX_SYSTEM"
            exit 0
          fi

          logged_in_to_flakehub=false
          if nix store info --store https://cache.flakehub.com > /dev/null 2>&1; then
            logged_in_to_flakehub=true
          fi

          to_build=()
          while IFS=' ' read -r installable output_paths; do
            # shellcheck disable=SC2086 # output_paths is intentionally split
            if [ "$logged_in_to_flakehub" = true ] \
              && nix path-info --store https://cache.flakehub.com $output_paths > /dev/null 2>&1; then
              echo "Skipping $installable: its outputs are already in FlakeHub Cache."
            else
              to_build+=("$installable")
            fi
          done <<< "$derivations"

          if [ "${#to_build[@]}" -eq 0 ]; then
            echo "All derivations for $NIX_SYSTEM are already in FlakeHub Cache"
            exit 0
          fi

          echo "Building ${#to_build[@]} derivation(s) for $NIX_SYSTEM"
          nix build --no-link --print-out-paths --print-build-logs "${to_build[@]}"

  success:
    runs-on: ubuntu-latest
    needs:
      - inventory
      - build
    if: ${{ always() }}
    permissions:
      id-token: write
      contents: read

    outputs:
      flake_name: ${{ steps.publish.outputs.flake_name }}
      flake_version: ${{ steps.publish.outputs.flake_version }}
      flakeref_exact: ${{ steps.publish.outputs.flakeref_exact }}
      flakeref_at_least: ${{ steps.publish.outputs.flakeref_at_least }}
    steps:
      - run: "true"
      - run: |
          echo "A dependent job did not succeed (inventory: ${NEEDS_INVENTORY_RESULT}, build: ${NEEDS_BUILD_RESULT})."
          exit 1
        env:
          NEEDS_INVENTORY_RESULT: ${{ needs.inventory.result }}
          NEEDS_BUILD_RESULT: ${{ needs.build.result }}
        # Check for anything other than success, not just failure: when
        # inventory fails, build is skipped, and we must not publish then.
        if: |
          needs.inventory.result != 'success' ||
          needs.build.result != 'success'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ (!github.event.repository.fork || (inputs.allow-fork != '' && github.repository == inputs.allow-fork)) && inputs.visibility != '' && (github.ref == format('refs/heads/{0}', inputs.default-branch) || startsWith(github.ref, 'refs/tags/')) }}
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@main
        if: ${{ (!github.event.repository.fork || (inputs.allow-fork != '' && github.repository == inputs.allow-fork)) && inputs.visibility != '' && (github.ref == format('refs/heads/{0}', inputs.default-branch) || startsWith(github.ref, 'refs/tags/')) }}
      - uses: DeterminateSystems/flakehub-cache-action@main
        if: ${{ (!github.event.repository.fork || (inputs.allow-fork != '' && github.repository == inputs.allow-fork)) && inputs.visibility != '' && (github.ref == format('refs/heads/{0}', inputs.default-branch) || startsWith(github.ref, 'refs/tags/')) }}
      - uses: DeterminateSystems/flakehub-push@main
        if: ${{ (!github.event.repository.fork || (inputs.allow-fork != '' && github.repository == inputs.allow-fork)) && inputs.visibility != '' && (github.ref == format('refs/heads/{0}', inputs.default-branch) || startsWith(github.ref, 'refs/tags/')) }}
        id: publish
        with:
          rolling: ${{ github.ref == format('refs/heads/{0}', inputs.default-branch) }}
          visibility: ${{ inputs.visibility }}
          include-output-paths: true
          directory: ${{ inputs.directory }}
